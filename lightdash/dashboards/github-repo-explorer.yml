contentType: dashboard
description: Explore GitHub repository activity loaded by the dlt github_api pipeline into MotherDuck — commits, issues, pull requests, and contributors
filters:
  dimensions:
    - disabled: false
      label: Time period
      operator: inThePast
      required: false
      settings:
        completed: false
        unitOfTime: months
      target:
        fieldId: commits_authored_at_day
        tableName: commits
      tileTargets:
        comments-kpi:
          fieldId: issues_created_at_day
          tableName: issues
        contributors-kpi: false
        issues-by-author-association:
          fieldId: issues_created_at_day
          tableName: issues
        issues-kpi:
          fieldId: issues_created_at_day
          tableName: issues
        issues-opened-per-month:
          fieldId: issues_created_at_day
          tableName: issues
        recent-issues-table:
          fieldId: issues_created_at_day
          tableName: issues
        top-contributors: false
      values:
        - 12
name: GitHub Repo Explorer
slug: github-repo-explorer
spaceSlug: github
tabs: []
